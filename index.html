git<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Unity WebGL Game</title>

    <link
        href="https://cdn.jsdelivr.net/gh/paigerodeghero/academicwebsite@897c910c65e6c68b04c44a6b6eba0b99d0f2f2cf/TemplateData/style.css"
        rel="stylesheet"
    >

    <style type="text/css">
        #button {
            display: none;
        }

        .imgb_vis {
            animation: imgb-animation 7s linear;
        }

        @keyframes imgb-animation {
            10% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(100px);
            }

            90% {
                transform: translateX(100px);
            }

            100% {
                transform: translateX(0);
            }
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .webgl-content {
            width: 100vw;
            height: 100vh;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
            padding: 0;
            margin: 0;
            border: 0;
            position: relative;
            background: rgb(35, 31, 32);
        }

        #gameContainer canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body dir="ltr">

    <div class="webgl-content">
        <div id="gameContainer">
            <canvas id="canvas"></canvas>

            <div class="logo Dark"></div>

            <div class="progress Dark">
                <div class="empty"></div>
                <div class="full"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/lee2sman/everyday@d45d601d2c4d60adf809a0b677c00b7d12aba7e9/96/TemplateData/UnityProgress.js"></script>

    <script src="https://cdn.jsdelivr.net/gh/gertdoro/SQLite4Unity3d@eda39654f6ca782386c5d8c43677a36873fc1319/Example/Assets/js/sb.js"></script>

    <script>
        var gameInstance = UnityLoader.instantiate(
            "gameContainer",
            "https://cdn.jsdelivr.net/gh/gertdoro/SQLite4Unity3d@eda39654f6ca782386c5d8c43677a36873fc1319/Example/Assets/js/sb.json",
            {
                onProgress: UnityProgress,
                Module: {
                    onRuntimeInitialized: function () {
                        UnityProgress(gameInstance, "complete");
                    }
                }
            }
        );
    </script>

</body>
</html>
